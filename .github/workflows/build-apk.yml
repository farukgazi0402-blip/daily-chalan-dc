name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Cordova
        run: npm install -g cordova

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Cordova Project Structure
        run: |
          mkdir -p www
          # যদি আপনার index.html রুট ফোল্ডারে থাকে, তবে তা www ফোল্ডারে সরিয়ে নেওয়া হবে
          if [ -f index.html ]; then cp index.html www/; fi
          # config.xml ফাইলটি যদি বাইরে থাকে তা সঠিক জায়গায় নিশ্চিত করা
          cordova platform add android --nofetch

      - name: Build Release APK
        run: cordova build android --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
