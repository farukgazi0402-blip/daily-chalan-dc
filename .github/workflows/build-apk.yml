name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Cordova
        run: npm install -g cordova

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Project Structure
        run: |
          mkdir -p www
          # যদি index.html বাইরে থাকে তবে তা www ফোল্ডারে নিয়ে যাবে
          if [ -f index.html ]; then cp index.html www/; fi
          # যদি css/js বা অন্যান্য ফোল্ডার থাকে তা www তে রাখা নিশ্চিত করুন
          cordova platform add android --nofetch

      - name: Build Debug APK (Direct Installable)
        run: cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
